<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0fHveK-y9A6tGVOEbv-1uE-gL6oWKvF8",
            authDomain: "dominikavoyto.firebaseapp.com",
            projectId: "dominikavoyto",
            storageBucket: "dominikavoyto.firebasestorage.app",
            messagingSenderId: "104108514397",
            appId: "1:104108514397:web:63b1c204ba8c40304a41b4",
            measurementId: "G-61XDF70Q8S"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.signOut = signOut;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;

        onAuthStateChanged(auth, async (user) => {
            const authScreen = document.getElementById('auth-screen');
            const appScreen = document.getElementById('app-screen');
            if (user) {
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                document.getElementById('user-email-display').innerText = user.email;
                await loadCloudData(user.uid);
            } else {
                authScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
            }
        });
    </script>
</head>
<body data-theme="dark">

    <!-- ЕКРАН АВТОРИЗАЦІЇ (Показується першим, якщо користувач не увійшов) -->
    <div id="auth-screen" class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">WORKOUT PRO</div>
            <p class="auth-subtitle">Увійди в акаунт або створи новий</p>
            
            <div class="input-group">
                <input type="email" id="auth-email" class="prog-input" placeholder="Email пошта">
            </div>
            <div class="input-group">
                <input type="password" id="auth-password" class="prog-input" placeholder="Пароль (мін. 6 символів)">
            </div>
            
            <div class="auth-btn-group">
                <button class="primary-btn" onclick="handleLogin()">Увійти</button>
                <button class="outline-btn" onclick="handleRegister()">Створити акаунт</button>
            </div>
            <div id="auth-error" class="auth-error"></div>
        </div>
    </div>

    <!-- ОСНОВНИЙ ДОДАТОК (З'являється тільки після входу) -->
    <div id="app-screen" class="app-container hidden">
        <header class="header">
            <div class="header-user">
                <span id="user-email-display" class="user-email">користувач</span>
                <span id="week-info" class="status-badge">Завантаження...</span>
            </div>
            <div class="top-bar-btns">
                <button class="icon-btn" onclick="toggleTheme()" title="Тема">🌓</button>
                <button class="icon-btn danger" onclick="handleLogout()" title="Вийти">Вийти</button>
            </div>
        </header>

        <!-- Головне меню вибору дій -->
        <div id="home-dashboard" class="card-panel">
            <h2 class="section-title">Головне меню</h2>
            <div class="menu-stack">
                <button class="primary-btn success" onclick="startActiveWorkout()">🔥 Розпочати тренування</button>
                <button class="primary-btn" onclick="showGeneratorPanel()">⚙️ Створити план на тиждень</button>
                <button class="outline-btn" onclick="openBackupModal()">💾 Експорт / Імпорт даних</button>
            </div>
        </div>

        <!-- Панель генератора тижня -->
        <div id="generator-panel" class="card-panel hidden">
            <h2 class="section-title">Новий тижневий план</h2>
            <div class="input-group">
                <label>Днів тренувань на тиждень</label>
                <input type="number" id="days" value="4" min="1" max="7" class="prog-input">
            </div>
            <div class="input-group">
                <label>Тривалість заняття (хв)</label>
                <input type="number" id="minutes" value="90" min="10" max="180" class="prog-input">
            </div>
            <div class="input-group">
                <label>Режим преса (Core)</label>
                <select id="absMode" class="prog-input">
                    <option value="everyday">В кінці кожного дня</option>
                    <option value="separate">Окремий день</option>
                    <option value="none">Не робити</option>
                </select>
            </div>
            <div class="input-group">
                <label>Час на прес (хв)</label>
                <input type="number" id="absMinutes" value="15" min="5" max="60" class="prog-input">
            </div>
            <div class="input-group row-align">
                <label>Тільки "Вдома" (без тренажерів)</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="isHome">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="menu-stack" style="margin-top: 16px;">
                <button class="primary-btn" onclick="generateAndSaveWeek()">Зберегти план</button>
                <button class="outline-btn" onclick="hideGeneratorPanel()">Назад</button>
            </div>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('workout')">Тренування</button>
            <button class="tab-btn" onclick="switchTab('analytics')">Аналітика</button>
        </div>

        <!-- Вкладка тренувань -->
        <div id="tab-workout">
            <div id="active-workout-container"></div>
        </div>

        <!-- Вкладка аналітики -->
        <div id="tab-analytics" class="hidden">
            <div class="card-panel">
                <h2 class="section-title">Прогресія робочої ваги</h2>
                <select id="chart-selector" class="prog-input mb-3" onchange="updateChart()"></select>
                <canvas id="progressChart" width="400" height="200"></canvas>
            </div>
        </div>
    </div>

    <!-- Модалка бекапу -->
    <div id="backup-modal" class="card-panel hidden modal-box">
        <h2 class="section-title">Резервна копія</h2>
        <p class="text-muted text-sm mb-3">Збережи свої дані у файл або завантаж їх.</p>
        <div class="menu-stack">
            <button class="primary-btn" onclick="exportDataJSON()">📥 Експорт JSON</button>
            <input type="file" id="import-file" class="prog-input" onchange="importDataJSON(event)">
            <button class="outline-btn" onclick="closeBackupModal()">Закрити</button>
        </div>
    </div>

    <!-- Плаваючий мінімалістичний таймер відпочинку -->
    <div id="rest-timer-bar" class="timer-overlay hidden">
        <span id="timer-display" class="timer-text">01:30</span>
        <button class="outline-btn" style="padding: 4px 10px; font-size: 12px;" onclick="stopRestTimer()">Пропустити</button>
    </div>

    <script src="exercises.js"></script>
    <script>
        let myChart = null;
        let analyticsDataStore = [];
        let timerInterval = null;
        let cloudData = { history: {}, weekSchedule: null, currentDayIndex: 0 };

        async function handleRegister() {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try {
                await window.createUserWithEmailAndPassword(window.firebaseAuth, email, pass);
            } catch (err) {
                document.getElementById('auth-error').innerText = err.message;
            }
        }

        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try {
                await window.signInWithEmailAndPassword(window.firebaseAuth, email, pass);
            } catch (err) {
                document.getElementById('auth-error').innerText = err.message;
            }
        }

        async function handleLogout() {
            await window.signOut(window.firebaseAuth);
        }

        async function loadCloudData(uid) {
            try {
                const docRef = window.doc(window.firebaseDb, "users", uid);
                const docSnap = await window.getDoc(docRef);
                if (docSnap.exists()) {
                    cloudData = docSnap.data();
                    if(cloudData.currentDayIndex === undefined) cloudData.currentDayIndex = 0;
                } else {
                    cloudData = { history: {}, weekSchedule: null, currentDayIndex: 0 };
                }
                initAppAfterLoad();
            } catch (err) {
                console.error("Помилка завантаження хмари:", err);
            }
        }

        async function saveCloudData() {
            const user = window.firebaseAuth.currentUser;
            if (!user) return;
            try {
                const docRef = window.doc(window.firebaseDb, "users", user.uid);
                await window.setDoc(docRef, cloudData);
            } catch (err) {
                console.error("Помилка збереження хмари:", err);
            }
        }

        function initAppAfterLoad() {
            if (cloudData.weekSchedule && cloudData.weekSchedule.length > 0) {
                document.getElementById('week-info').innerText = `План активний (День ${cloudData.currentDayIndex + 1} з ${cloudData.weekSchedule.length})`;
                document.getElementById('home-dashboard').classList.remove('hidden');
            } else {
                document.getElementById('week-info').innerText = "План не створено";
                showGeneratorPanel();
            }
        }

        function showGeneratorPanel() {
            document.getElementById('generator-panel').classList.remove('hidden');
            document.getElementById('home-dashboard').classList.add('hidden');
        }
        function hideGeneratorPanel() {
            document.getElementById('generator-panel').classList.add('hidden');
            if (cloudData.weekSchedule) document.getElementById('home-dashboard').classList.remove('hidden');
        }

        function generateAndSaveWeek() {
            cloudData.weekSchedule = generateScheduleLogic();
            cloudData.currentDayIndex = 0; // скидаємо на перший день
            saveCloudData();
            document.getElementById('week-info').innerText = `План активний (День 1 з ${cloudData.weekSchedule.length})`;
            hideGeneratorPanel();
            document.getElementById('home-dashboard').classList.remove('hidden');
            showToast("✨ План успішно створено!");
        }

        // Послідовне стартування тренування (День 1, потім День 2 і т.д.)
        function startActiveWorkout() {
            if (!cloudData.weekSchedule || cloudData.weekSchedule.length === 0) {
                showGeneratorPanel();
                return;
            }
            document.getElementById('home-dashboard').classList.add('hidden');
            renderActiveDayWorkout(cloudData.currentDayIndex);
        }

        function renderActiveDayWorkout(dayIdx) {
            const container = document.getElementById('active-workout-container');
            const day = cloudData.weekSchedule[dayIdx];
            if (!day) return;

            let exercisesHtml = day.exercises.map((ex, eIdx) => renderExerciseHtml(ex, `${dayIdx}_${eIdx}`)).join('');
            
            container.innerHTML = `
                <div class="card-panel">
                    <div class="day-header-flex">
                        <h2>${day.dayName}</h2>
                        <span class="text-sm text-muted">~${day.totalTime} хв</span>
                    </div>
                    <div class="exercise-list">${exercisesHtml}</div>
                    <div style="margin-top: 20px;">
                        <button class="primary-btn success" onclick="finishWorkout(${dayIdx})">💾 Завершити і зберегти тренування</button>
                    </div>
                </div>`;
        }

        function finishWorkout(dayIdx) {
            // Переходимо до наступного дня циклічно
            cloudData.currentDayIndex = (dayIdx + 1) % cloudData.weekSchedule.length;
            saveCloudData();
            document.getElementById('week-info').innerText = `План активний (Наступний: День ${cloudData.currentDayIndex + 1})`;
            document.getElementById('active-workout-container').innerHTML = '';
            document.getElementById('home-dashboard').classList.remove('hidden');
            showToast("🎉 Тренування збережено! Молодець!");
        }

        function generateScheduleLogic() {
            const days = parseInt(document.getElementById('days').value);
            const minutes = parseInt(document.getElementById('minutes').value);
            const absMode = document.getElementById('absMode').value;
            const absMinutes = parseInt(document.getElementById('absMinutes').value);
            const isHome = document.getElementById('isHome').checked;

            let availableEx = [...exercisesList];
            if (isHome) {
                const gymWords = ["штанг", "станов", "румунськ", "фронтальн", "підтягування", "брус", "блок", "кросовер", "гравітрон", "тренажер", "ролик"];
                availableEx = availableEx.filter(e => e.equipment !== "Machine" && !gymWords.some(w => e.name.toLowerCase().includes(w)));
            }

            const warmups = availableEx.filter(e => e.category === "Warmup");
            const cooldowns = availableEx.filter(e => e.category === "Cooldown");
            const coreEx = availableEx.filter(e => e.category === "Core");
            const mainEx = availableEx.filter(e => e.category === "Upper" || e.category === "Lower");

            let splitPattern = [];
            if (days === 1) splitPattern.push("FullBody");
            else if (days === 2) splitPattern.push("Upper", "Lower");
            else if (days === 3) splitPattern.push("Upper", "Lower", "FullBody");
            else if (days === 4) splitPattern.push("Upper", "Lower", "Upper", "Lower");
            else if (days === 5) splitPattern.push("Upper", "Lower", "Upper", "Lower", "FullBody");
            else { for(let i=0; i<days; i++) splitPattern.push(i % 2 === 0 ? "Upper" : "Lower"); }

            if (absMode === "separate" && days >= 2) splitPattern[days - 1] = "Core";

            let schedule = [];
            for(let i=0; i<days; i++) {
                let currentCategory = splitPattern[i];
                let todaysEx = [];

                if (currentCategory === "FullBody") {
                    let upper = mainEx.filter(e => e.category === "Upper").sort(() => Math.random() - 0.5);
                    let lower = mainEx.filter(e => e.category === "Lower").sort(() => Math.random() - 0.5);
                    let max = Math.max(upper.length, lower.length);
                    for(let j=0; j<max; j++) {
                        if (j < lower.length) todaysEx.push(lower[j]);
                        if (j < upper.length) todaysEx.push(upper[j]);
                    }
                } else {
                    todaysEx = availableEx.filter(e => e.category === currentCategory).sort(() => Math.random() - 0.5);
                }

                let dailyList = [];
                let currentMinutes = 0;
                let timeLimit = minutes;

                let w = warmups.sort(() => Math.random() - 0.5)[0];
                if (w) { dailyList.push(mapEx(w, cloudData.history)); currentMinutes += w.timeMinutes; }

                if (absMode === "everyday" && currentCategory !== "Core") timeLimit -= absMinutes;

                for(let ex of todaysEx) {
                    if (currentMinutes + ex.timeMinutes + 5 <= timeLimit) {
                        dailyList.push(mapEx(ex, cloudData.history));
                        currentMinutes += ex.timeMinutes;
                    }
                }

                let c = cooldowns.sort(() => Math.random() - 0.5)[0];
                if (c) { dailyList.push(mapEx(c, cloudData.history)); currentMinutes += c.timeMinutes; }

                let uaCategory = currentCategory === "Upper" ? "Верх тіла" : (currentCategory === "Lower" ? "Низ тіла" : (currentCategory === "Core" ? "Прес" : "Все тіло"));
                schedule.push({ dayName: `День ${i + 1} — ${uaCategory}`, totalTime: currentMinutes, exercises: dailyList });
            }
            return schedule;
        }

        function mapEx(ex, history) {
            let prog = history[ex.id];
            let setsCount = (prog && prog.sets > 0) ? prog.sets : ex.defaultSets;
            let sw = [];
            for(let s=0; s<setsCount; s++) {
                let oldW = (prog && prog.setWeights && prog.setWeights.length > s) ? prog.setWeights[s] : 0;
                sw.push(oldW > 0 ? oldW : 0);
            }
            return { ...ex, sets: setsCount, reps: ex.defaultReps, suggestedWeights: sw };
        }

        function renderExerciseHtml(ex, uniqueId) {
            let setInputsHtml = '';
            for(let i=0; i<ex.sets; i++) {
                let w = (ex.suggestedWeights && ex.suggestedWeights[i]) ? ex.suggestedWeights[i] : '';
                let disabled = (ex.category === "Warmup" || ex.category === "Cooldown") ? "disabled" : "";
                
                setInputsHtml += `
                    <div class="set-row">
                        <span class="text-sm">Підхід ${i+1}</span>
                        <div class="weight-flex">
                            <input type="number" step="0.5" class="prog-input text-center" value="${w > 0 ? w : ''}" placeholder="0" ${disabled} oninput="autoSaveWeight(this, '${ex.id}', ${i})">
                            <span class="text-sm text-muted">кг</span>
                        </div>
                        <span class="text-sm text-muted">× ${ex.reps}</span>
                        ${disabled === "" ? `<button class="outline-btn" style="padding: 4px 8px; font-size:11px;" onclick="startRestTimer()">⏳ 90с</button>` : ''}
                    </div>`;
            }

            return `
                <div class="exercise-card">
                    <div class="exercise-top">
                        <div>
                            <span class="exercise-title">${ex.name}</span>
                            <span class="text-sm text-muted">${ex.sets} підходів • ${ex.reps}</span>
                        </div>
                        <button class="outline-btn" onclick="toggleInfo('${uniqueId}')">Опис</button>
                    </div>
                    <div id="info-${uniqueId}" class="info-box hidden"><strong>Техніка:</strong> ${ex.description}</div>
                    <div class="sets-stack">${setInputsHtml}</div>
                </div>`;
        }

        function toggleInfo(id) { document.getElementById(`info-${id}`).classList.toggle('hidden'); }

        function autoSaveWeight(inputElement, exId, setIndex) {
            const val = parseFloat(inputElement.value) || 0;
            const today = new Date().toLocaleDateString('uk-UA', {day: '2-digit', month: '2-digit'});

            if (!cloudData.history[exId]) {
                cloudData.history[exId] = { sets: 4, setWeights: [], historyDates: [], historyWeights: [] };
            }
            
            let oldWeight = cloudData.history[exId].setWeights[setIndex] || 0;
            cloudData.history[exId].setWeights[setIndex] = val;

            if (val > 0) {
                cloudData.history[exId].historyDates.push(today);
                cloudData.history[exId].historyWeights.push(val);
                if (val > oldWeight && oldWeight > 0) {
                    showToast(`🔥 Прогрес! +${(val - oldWeight).toFixed(1)} кг!`);
                }
            }
            saveCloudData();
        }

        // Таймер відпочинку з можливістю дострокового завершення
        function startRestTimer() {
            clearInterval(timerInterval);
            let timeLeft = 90;
            const bar = document.getElementById('rest-timer-bar');
            const display = document.getElementById('timer-display');
            bar.classList.remove('hidden');

            timerInterval = setInterval(() => {
                let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                let s = (timeLeft % 60).toString().padStart(2, '0');
                display.innerText = `${m}:${s}`;
                if (timeLeft <= 0) {
                    stopRestTimer();
                    if (navigator.vibrate) navigator.vibrate(200);
                }
                timeLeft--;
            }, 1000);
        }

        function stopRestTimer() {
            clearInterval(timerInterval);
            document.getElementById('rest-timer-bar').classList.add('hidden');
        }

        function showToast(text) {
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerText = text;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Виправлене перемикання тем
        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute('data-theme');
            body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }

        function openBackupModal() { document.getElementById('backup-modal').classList.remove('hidden'); }
        function closeBackupModal() { document.getElementById('backup-modal').classList.add('hidden'); }

        function exportDataJSON() {
            const blob = new Blob([JSON.stringify(cloudData, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_workout.json`;
            a.click();
        }

        function importDataJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    cloudData = JSON.parse(e.target.result);
                    saveCloudData();
                    showToast("✅ Імпорт успішний!");
                    setTimeout(() => location.reload(), 1500);
                } catch (err) {
                    alert("Помилка JSON файлу!");
                }
            };
            reader.readAsText(file);
        }

        function switchTab(tab) {
            document.getElementById('tab-workout').classList.add('hidden');
            document.getElementById('tab-analytics').classList.add('hidden');
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            if (tab === 'analytics') loadAnalytics();
        }

        function loadAnalytics() {
            const history = cloudData.history;
            analyticsDataStore = Object.keys(history).filter(k => history[k].historyWeights && history[k].historyWeights.length > 0).map(k => {
                let ex = exercisesList.find(e => e.id === k);
                return { name: ex ? ex.name : k, dates: history[k].historyDates, weights: history[k].historyWeights };
            });

            const selector = document.getElementById('chart-selector');
            selector.innerHTML = '';
            if(analyticsDataStore.length === 0) {
                selector.innerHTML = '<option>Немає даних аналітики</option>';
                if(myChart) myChart.destroy();
                return;
            }
            analyticsDataStore.forEach((item, index) => { selector.innerHTML += `<option value="${index}">${item.name}</option>`; });
            updateChart();
        }

        function updateChart() {
            const index = document.getElementById('chart-selector').value;
            const data = analyticsDataStore[index];
            if(!data) return;
            const ctx = document.getElementById('progressChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: data.dates, datasets: [{ label: 'Макс. вага (кг)', data: data.weights, borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', borderWidth: 2, tension: 0.2, fill: true }] },
                options: { scales: { y: { ticks: { color: 'var(--text-muted)' } }, x: { ticks: { color: 'var(--text-muted)' } } }, plugins: { legend: { labels: { color: 'var(--text-color)' } } } }
            });
        }
    </script>
</body>
</html>
